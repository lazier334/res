<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本前缀处理器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            gap: 0;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #ffffff;
        }

        .panel-left {
            border-right: 2px solid #e4e8ed;
        }

        .panel-header {
            padding: 12px 16px;
            background: #fafbfc;
            border-bottom: 1px solid #e4e8ed;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .panel-header label {
            font-size: 14px;
            font-weight: 600;
            color: #1d2129;
            white-space: nowrap;
        }

        .prefix-input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
            background: #ffffff;
            min-width: 60px;
        }

        .prefix-input:focus {
            border-color: #2468f2;
            box-shadow: 0 0 0 2px rgba(36, 104, 242, 0.12);
        }

        .prefix-hint {
            font-size: 13px;
            color: #86909c;
            white-space: nowrap;
            user-select: none;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 16px 18px;
            border: none;
            outline: none;
            resize: none;
            font-size: 15px;
            line-height: 1.65;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
            background: transparent;
            color: #1d2129;
            tab-size: 4;
            letter-spacing: 0.01em;
        }

        textarea::placeholder {
            color: #bcc2cc;
            font-weight: 400;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .panel-right textarea {
            background: #f8faff;
            color: #1a2332;
        }

        .copy-btn {
            position: fixed;
            bottom: 28px;
            right: 30px;
            padding: 10px 22px;
            background: #2468f2;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(36, 104, 242, 0.35);
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .copy-btn:hover {
            background: #1a57d4;
            box-shadow: 0 6px 26px rgba(36, 104, 242, 0.45);
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .copy-btn.copied {
            background: #00a854;
            box-shadow: 0 4px 20px rgba(0, 168, 84, 0.4);
        }

        @media (max-width: 640px) {
            .container {
                flex-direction: column;
            }

            .panel-left {
                border-right: none;
                border-bottom: 2px solid #e4e8ed;
                max-height: 50vh;
            }

            .panel-right {
                max-height: 50vh;
            }

            .copy-btn {
                bottom: 16px;
                right: 16px;
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 左侧：原文 -->
        <div class="panel panel-left">
            <div class="panel-header">
                <label for="source">📄 原文</label>
                <span style="flex:1;"></span>
                <span style="font-size:13px;color:#86909c;">逐行处理</span>
            </div>
            <textarea id="source" placeholder="在此输入原文&#10;每行将自动添加前缀..."></textarea>
        </div>

        <!-- 右侧：处理后 -->
        <div class="panel panel-right">
            <div class="panel-header">
                <label for="prefix">🏷️ 前缀</label>
                <input type="text" id="prefix" class="prefix-input" value=" _" placeholder="输入前缀，如  _" autofocus>
                <input type="checkbox" id="simplePrefix" checked>
                <span class="prefix-hint">精简前缀</span>
            </div>
            <textarea id="output" placeholder="处理后结果将显示在这里…"></textarea>
        </div>
    </div>

    <button class="copy-btn" id="copyBtn">📋 复制结果</button>

    <script>
        (function () {
            const source = document.getElementById('source');
            const prefixInput = document.getElementById('prefix');
            const output = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const simplePrefix = document.getElementById('simplePrefix');

            // 核心处理函数：将左侧文本按行加前缀，并用反引号包裹
            function processText() {
                const raw = source.value;
                const prefix = prefixInput.value;
                const TrimChar = prefix.replace(prefix.trim(), '');
                const allPrefix = !simplePrefix.checked;

                // 转义反斜杠，然后按行分割，保留空行
                const lines = raw.replaceAll('\\', '\\\\')
                    .replaceAll('```', '$code')
                    .replaceAll('`', '\\`')
                    .trim()
                    .split('\n');
                // 每一行加上前缀（包括空行也加，保持行数一致）
                const prefixedLines = lines.map((line, i) => (i == 0 || allPrefix ? prefix : TrimChar) + line);
                // 用换行符拼接
                const innerContent = prefixedLines.join('\n');
                // 用反引号包裹 —— 注意：如果内容本身包含反引号，这里不做转义（符合JS模板字面量直观展示）
                // 但为了更严谨，可以保留原样展示，用户看到的就是反引号字符串区块
                const result = '`\n' + innerContent + `\n${prefix.replace('_', '').replace('    ', '')}\``;

                output.value = result;
            }

            // 防抖，避免高频刷新卡顿
            let debounceTimer = null;

            function debouncedProcess() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    processText();
                    debounceTimer = null;
                }, 24);
            }

            // 绑定输入事件
            source.addEventListener('input', debouncedProcess);
            prefixInput.addEventListener('input', debouncedProcess);
            simplePrefix.addEventListener('change', debouncedProcess);

            // 初始执行一次
            processText();

            // ——— 复制功能 ———
            copyBtn.addEventListener('click', function () {
                const textToCopy = output.value;
                if (!textToCopy) {
                    // 如果为空，轻提醒
                    this.textContent = '⚠️ 无内容';
                    setTimeout(() => {
                        this.innerHTML = '📋 复制结果';
                    }, 1200);
                    return;
                }

                // 使用 Clipboard API
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const btn = copyBtn;
                    btn.classList.add('copied');
                    btn.innerHTML = '✅ 已复制';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '📋 复制结果';
                    }, 1800);
                }).catch(() => {
                    // fallback: 使用 textarea 选中复制
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = textToCopy;
                        ta.style.position = 'fixed';
                        ta.style.left = '-9999px';
                        ta.style.top = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        const btn = copyBtn;
                        btn.classList.add('copied');
                        btn.innerHTML = '✅ 已复制';
                        setTimeout(() => {
                            btn.classList.remove('copied');
                            btn.innerHTML = '📋 复制结果';
                        }, 1800);
                    } catch (err) {
                        alert('复制失败，请手动选中复制');
                    }
                });
            });

            // 额外：左侧面板点击小优化，让用户知道可编辑
            source.addEventListener('focus', function () {
                this.parentElement.style.background = '#ffffff';
            });
            source.addEventListener('blur', function () {
                this.parentElement.style.background = '';
            });

            // 快捷键：Ctrl+Shift+C 触发复制 (方便)
            document.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
                    e.preventDefault();
                    copyBtn.click();
                }
            });

            console.log('✅ 文本前缀处理器已启动 — 左侧输入，右侧实时预览反引号字符串块');
        })();
    </script>

</body>

</html>
